plugins { id 'java-library' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
sourceSets { main { java.srcDirs = ['../../transport-core/src/main/java'] } }
sourceSets {
    interop {
        java.srcDirs = ['../../tests/secure-interop/java']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations { interopImplementation.extendsFrom implementation }
dependencies {
    api project(':public-contracts')
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
    testImplementation 'junit:junit:4.13.2'
}
tasks.register('writeInteropClasspath') {
    dependsOn interopClasses
    dependsOn configurations.interopRuntimeClasspath
    doLast { file('build/interop-classpath.txt').text = sourceSets.interop.runtimeClasspath.asPath }
}
