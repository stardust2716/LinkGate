plugins { id 'com.android.application' }
def fixtureKey = providers.environmentVariable('LINKGATE_FIXTURE_KEYSTORE')
android {
    namespace 'org.example.linkgate.nativeconsumer'
    compileSdk 36
    defaultConfig {
        applicationId 'org.example.linkgate.nativeconsumer'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.3.0-fixture'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs { fixture { if(fixtureKey.isPresent()) {storeFile file(fixtureKey.get());storePassword 'fixture-only';keyAlias 'fixture';keyPassword 'fixture-only'} } }
    buildTypes { debug { signingConfig signingConfigs.fixture } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.configureEach { if(name.startsWith('validateSigning')) doFirst { if(!fixtureKey.isPresent()) throw new GradleException('Explicit independent fixture keystore required.') } }
dependencies {
    implementation project(':client-streams')
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
