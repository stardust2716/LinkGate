plugins { id 'java-library' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
sourceSets { main { java.srcDirs = ['../../control-auth/java/src/main/java'] } }
sourceSets {
    interop {
        java.srcDirs=['../../tests/server-authority/java','../../tests/control-authority/java']
        compileClasspath+=sourceSets.main.output
        runtimeClasspath+=sourceSets.main.output
    }
}
configurations { interopImplementation.extendsFrom implementation }
dependencies {
    api project(':public-contracts')
    implementation project(':secure-transport')
    implementation 'com.nimbusds:nimbus-jose-jwt:10.10'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    testImplementation 'junit:junit:4.13.2'
}
tasks.register('writeInteropClasspath') {
    dependsOn interopClasses
    dependsOn configurations.interopRuntimeClasspath
    doLast {file('build/interop-classpath.txt').text=sourceSets.interop.runtimeClasspath.asPath}
}
